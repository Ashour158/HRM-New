apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hcm-api
  labels: { app: hcm-platform, component: api }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hcm-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Percent, value: 50, periodSeconds: 60 }
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hcm-web
  labels: { app: hcm-platform, component: web }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hcm-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
