apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This base is deliberately environment-agnostic: no `namespace:` and no `images:`
# override live here. Every environment-specific value (namespace, replica counts,
# resource requests/limits, ingress host, image tag) is owned by an overlay —
# see deploy/k8s/overlays/production/ and deploy/k8s/overlays/staging/.
#
# Do not `kubectl apply -k` this directory directly; apply an overlay instead:
#   kubectl apply -k deploy/k8s/overlays/production
#   kubectl apply -k deploy/k8s/overlays/staging

resources:
  - namespace.yaml
  - configmap.yaml
  - api-deployment.yaml
  - api-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - migration-job.yaml
  - ingress.yaml
  - backup-cronjob.yaml
  - restore-drill-cronjob.yaml
  - hpa.yaml
  - pdb.yaml
