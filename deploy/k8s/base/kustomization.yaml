apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hcm-production

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.example.yaml
  - api-deployment.yaml
  - api-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - migration-job.yaml
  - ingress.yaml

images:
  - name: ghcr.io/your-org/hr-hcm-api
    newTag: v1.4.0
  - name: ghcr.io/your-org/hr-hcm-web
    newTag: v1.4.0
