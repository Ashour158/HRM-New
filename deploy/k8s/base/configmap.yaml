apiVersion: v1
kind: ConfigMap
metadata:
  name: hcm-platform-config
data:
  NODE_ENV: production
  PORT: "3001"
  # Defense-in-depth: enable DB-level Row-Level Security. Requires the runtime to connect
  # as the restricted hcm_app role (DATABASE_URL) and cross-tenant workers as hcm_system
  # (SYSTEM_DATABASE_URL); the boot guard refuses to start if RLS is on while connected as
  # a superuser/BYPASSRLS role. Provision the roles once via infra/rls/provision-app-role.sql.
  DB_RLS_ENABLED: "true"
  # Connection-pool budget: every hcm-api pod opens up to TWO pg pools once
  # SYSTEM_DATABASE_URL is set (DATABASE_URL/hcm_app for requests, SYSTEM_DATABASE_URL/
  # hcm_system for background jobs — see packages/hr-database/src/connection/pool.ts).
  # Worst-case total connections = hpa maxReplicas x (DB_POOL_MAX + DB_SYSTEM_POOL_MAX).
  # deploy/k8s/base/hpa.yaml currently sets maxReplicas: 10 for hcm-api, so
  # 10 x (6 + 2) = 80, leaving headroom under Postgres's own out-of-the-box
  # max_connections=100 for admin/migration-job/PgBouncer-less operation. If you
  # provision a managed Postgres with a higher max_connections, raise these
  # proportionally; if you raise hpa maxReplicas, recompute this budget first —
  # exceeding max_connections fails the whole fleet with "too many clients already",
  # not just the pod that tips over.
  DB_POOL_MAX: "6"
  DB_SYSTEM_POOL_MAX: "2"
  REDIS_URL: redis://redis:6379
  KAFKA_BROKERS: redpanda:9092
  JWT_EXPIRES_IN: 1h
  REFRESH_TOKEN_EXPIRES_IN: 7d
  MFA_REQUIRED: "false"
  OIDC_ISSUER_URL: ""
  OIDC_CLIENT_ID: ""
  OIDC_REDIRECT_URI: ""
  SAML_METADATA_URL: ""
  SAML_ENTITY_ID: ""
  CORS_ORIGINS: https://hcm.example.com
  LOG_LEVEL: info
  OTEL_ENABLED: "false"
  OTEL_SERVICE_NAME: hr-api
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
