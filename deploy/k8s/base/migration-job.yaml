apiVersion: batch/v1
kind: Job
metadata:
  name: hcm-database-migrate
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: hcm-database-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/your-org/hr-hcm-api:v1.4.0
          imagePullPolicy: IfNotPresent
          command: ["pnpm", "--filter", "@hcm/database", "migrate"]
          envFrom:
            - configMapRef:
                name: hcm-platform-config
            - secretRef:
                name: hcm-platform-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
