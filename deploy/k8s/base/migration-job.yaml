apiVersion: batch/v1
kind: Job
metadata:
  name: hcm-database-migrate
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: hcm-database-migrate
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/your-org/hr-hcm-api:v1.4.0
          imagePullPolicy: IfNotPresent
          command: ["pnpm", "--filter", "@hcm/database", "migrate"]
          envFrom:
            - configMapRef:
                name: hcm-platform-config
            - secretRef:
                name: hcm-platform-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
