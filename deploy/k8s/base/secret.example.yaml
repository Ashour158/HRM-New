apiVersion: v1
kind: Secret
metadata:
  name: hcm-platform-secrets
type: Opaque
stringData:
  # Request path connects as the RLS-SUBJECT role (non-superuser, non-BYPASSRLS) so the
  # tenant_isolation policies take effect. hcm_admin (superuser) would silently bypass RLS.
  DATABASE_URL: postgresql://hcm_app:replace-me@postgres:5432/hcm_platform
  # Cross-tenant background workers (outbox/inbox/scheduler) connect as the BYPASSRLS role.
  SYSTEM_DATABASE_URL: postgresql://hcm_system:replace-me@postgres:5432/hcm_platform
  JWT_SECRET: replace-me
  ENCRYPTION_KEY_ID: replace-me
  SYSTEM_API_KEY: replace-me
  INTEGRATION_API_KEY: replace-me
  # 32-byte base64 AES-256-GCM key for BANKING/TAX/COMPENSATION and
  # SPECIAL_CATEGORY personal data encryption at rest. Boot fails in production
  # without it -- see apps/hr-api/src/config/app.config.ts.
  PII_DATA_ENCRYPTION_KEY: replace-me
  MFA_DEMO_CODE: ""
