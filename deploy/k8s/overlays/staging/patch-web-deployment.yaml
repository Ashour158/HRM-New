apiVersion: apps/v1
kind: Deployment
metadata:
  name: hcm-web
spec:
  # Matches the staging HPA's minReplicas (patch-web-hpa.yaml).
  replicas: 1
  template:
    spec:
      containers:
        - name: web
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
