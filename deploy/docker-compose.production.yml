services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hcm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hcm_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hcm_admin} -d ${POSTGRES_DB:-hcm_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:9092
      - --schema-registry-addr internal://0.0.0.0:8081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp 1
      - --memory 1G
      - --mode dev-container
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  api:
    image: ${HCM_API_IMAGE:-hcm/hr-api:local}
    build:
      context: ..
      dockerfile: apps/hr-api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-hcm_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hcm_platform}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: redpanda:9092
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      MFA_REQUIRED: ${MFA_REQUIRED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      SAML_METADATA_URL: ${SAML_METADATA_URL:-}
      SAML_ENTITY_ID: ${SAML_ENTITY_ID:-}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:?set ENCRYPTION_KEY_ID}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8088}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:8088}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-hr-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
    ports:
      - "${API_PORT:-3001}:3001"

  web:
    image: ${HCM_WEB_IMAGE:-hcm/hr-web:local}
    build:
      context: ..
      dockerfile: apps/hr-web/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8088}:8080"

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
