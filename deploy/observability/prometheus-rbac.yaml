apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels: { app: hcm-platform, component: observability }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hcm-prometheus
  labels: { app: hcm-platform, component: observability }
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hcm-prometheus
  labels: { app: hcm-platform, component: observability }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hcm-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: hcm-observability
