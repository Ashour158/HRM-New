# kube-state-metrics is what turns raw K8s object state (HPA status, replica counts,
# etc.) into Prometheus metrics. It is what makes the existing HcmHpaAtMaxReplicasSustained
# alert (prometheus-rules.yaml in this directory) possible at all — that rule reads
# kube_horizontalpodautoscaler_status_current_replicas / _spec_max_replicas, which do not
# exist as metrics without this deployment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  labels: { app: hcm-platform, component: observability }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hcm-kube-state-metrics
  labels: { app: hcm-platform, component: observability }
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - replicationcontrollers
      - resourcequotas
      - secrets
      - services
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["list", "watch"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
      - volumeattachments
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hcm-kube-state-metrics
  labels: { app: hcm-platform, component: observability }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hcm-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: hcm-observability
