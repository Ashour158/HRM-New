groups:
  - name: hcm-api-observability
    rules:
      - alert: HcmApiHighErrorRate
        expr: |
          sum(rate(hcm_http_errors_total[5m]))
            / clamp_min(sum(rate(hcm_http_requests_total[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
          service: hcm-api
        annotations:
          summary: "HRM Nexus API error rate is above 5%"
          runbook_url: "docs/observability-runbook.md#high-api-error-rate"

      - alert: HcmApiHighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(hcm_http_request_duration_seconds_bucket[5m])) by (le, route)
          ) > 1
        for: 10m
        labels:
          severity: warning
          service: hcm-api
        annotations:
          summary: "HRM Nexus API p95 latency is above 1 second"
          runbook_url: "docs/observability-runbook.md#high-api-latency"

      - alert: HcmOutboxPublishFailures
        expr: sum(rate(hcm_outbox_events_total{status="failed"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
          service: hcm-api
        annotations:
          summary: "Transactional outbox publishing is failing"
          runbook_url: "docs/observability-runbook.md#outbox-or-inbox-failures"

      - alert: HcmInboxProcessingFailures
        expr: sum(rate(hcm_inbox_events_total{status=~"failed_retryable|failed_non_retryable"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
          service: hcm-api
        annotations:
          summary: "Transactional inbox processing is failing"
          runbook_url: "docs/observability-runbook.md#outbox-or-inbox-failures"

  # Cost-guardrail alerts, same caveat as the infra-level alerts above: these rules
  # are inert until a real Prometheus/ServiceMonitor is deployed against the cluster
  # and scraping kube-state-metrics.
  - name: hcm-cost-guardrails
    rules:
      - alert: HcmHpaAtMaxReplicasSustained
        expr: |
          kube_horizontalpodautoscaler_status_current_replicas{namespace="hcm-production"}
            >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="hcm-production"}
        for: 30m
        labels:
          severity: warning
          service: hcm-api
        annotations:
          summary: "{{ $labels.horizontalpodautoscaler }} has been pinned at its maxReplicas ceiling for 30+ minutes"
          description: "Autoscaler {{ $labels.horizontalpodautoscaler }} in {{ $labels.namespace }} has been running at its configured maxReplicas ceiling for a sustained period. This is a cost/capacity signal, not necessarily an outage: either real demand has outgrown the ceiling (raise maxReplicas in deploy/k8s/base/hpa.yaml) or a runaway workload is masking a bug. Raising maxReplicas for hcm-api also raises the worst-case DB connection count -- recompute the pool budget in deploy/k8s/base/configmap.yaml first."
          runbook_url: "docs/observability-runbook.md#hpa-at-max-replicas"
