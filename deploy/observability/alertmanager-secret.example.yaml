# Template only — NOT applied by kustomization.yaml (same pattern as
# deploy/k8s/base/secret.example.yaml). Copy to a real secret.yaml with real values,
# keep it out of git, and apply it manually:
#   kubectl apply -n hcm-observability -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: hcm-alertmanager-secrets
  namespace: hcm-observability
type: Opaque
stringData:
  # Slack incoming webhook URL used by alertmanager-config.yaml's `slack_configs`.
  slack_webhook_url: "https://hooks.slack.com/services/REPLACE_ME/REPLACE_ME/REPLACE_ME"
  # PagerDuty Events API v2 integration routing key used by `pagerduty_configs`.
  pagerduty_routing_key: "REPLACE_ME_pagerduty_routing_key"
