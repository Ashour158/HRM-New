name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: pnpm secret:scan

      - name: Locale scan
        run: pnpm locale:scan

      - name: Deployment envelope check
        run: pnpm ci:verify-deployment-envelope

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Web content cleanliness
        run: pnpm --filter hr-web content:check

      - name: Web i18n hardcoded string scan
        run: pnpm --filter hr-web i18n:check

      - name: Web accessibility tests
        run: pnpm --filter hr-web test:a11y

      - name: Install Playwright browser
        run: pnpm --filter hr-web exec playwright install --with-deps chromium

      - name: Web browser smoke
        run: pnpm --filter hr-web test:e2e

      - name: Build
        run: pnpm build

  migration-verification:
    name: Verify database migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: hcm_admin
          POSTGRES_PASSWORD: hcm_ci_password
          POSTGRES_DB: hcm_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcm_admin -d hcm_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hcm_admin:hcm_ci_password@localhost:5432/hcm_platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations against PostgreSQL
        run: pnpm --filter @hcm/database migrate

  runtime-lifecycle-e2e:
    name: Runtime HTTP lifecycle E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: hcm_admin
          POSTGRES_PASSWORD: hcm_ci_password
          POSTGRES_DB: hcm_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcm_admin -d hcm_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hcm_admin:hcm_ci_password@localhost:5432/hcm_platform
      NODE_ENV: test
      JWT_SECRET: ci-runtime-lifecycle-secret
      KAFKA_BROKERS: ""
      REDIS_URL: ""
      MFA_REQUIRED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build database package graph
        run: pnpm --filter @hcm/database... build

      - name: Run migrations against PostgreSQL
        run: pnpm --filter @hcm/database migrate

      - name: Seed runtime lifecycle data
        run: pnpm --filter @hcm/database seed

      - name: Build API package graph
        run: pnpm --filter @hcm/hr-api... build

      - name: Run runtime lifecycle E2E
        run: pnpm --filter @hcm/hr-api run test:lifecycle

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: pnpm secret:scan

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hr-api
            dockerfile: apps/hr-api/Dockerfile
          - name: hr-web
            dockerfile: apps/hr-web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: hcm/${{ matrix.name }}:ci
          build-args: |
            VITE_API_BASE_URL=/api/v1
