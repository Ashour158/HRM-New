name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: pnpm secret:scan

      - name: Locale scan
        run: pnpm locale:scan

      - name: Compiled output hygiene check
        run: pnpm check:no-compiled-output-in-src

      - name: Deployment envelope check
        run: pnpm ci:verify-deployment-envelope

      - name: Build tooling script tests
        run: pnpm test:build-tooling

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Web content cleanliness
        run: pnpm --filter hr-web content:check

      - name: Web i18n hardcoded string scan
        run: pnpm --filter hr-web i18n:check

      - name: Web accessibility tests
        run: pnpm --filter hr-web test:a11y

      - name: Install Playwright browser
        run: pnpm --filter hr-web exec playwright install --with-deps chromium

      - name: Web browser smoke
        run: pnpm --filter hr-web test:e2e

      - name: Build
        run: pnpm build

  migration-verification:
    name: Verify database migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: hcm_admin
          POSTGRES_PASSWORD: hcm_ci_password
          POSTGRES_DB: hcm_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcm_admin -d hcm_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hcm_admin:hcm_ci_password@localhost:5432/hcm_platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build database package graph
        run: pnpm --filter @hcm/database... build

      - name: Run migrations against PostgreSQL
        run: pnpm --filter @hcm/database migrate

      - name: Check migration ledger drift
        run: node scripts/check-migration-ledger-drift.mjs

      - name: Run database tests against PostgreSQL (incl. migration roundtrip)
        run: pnpm --filter @hcm/database test

  runtime-lifecycle-e2e:
    name: Runtime HTTP lifecycle E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: hcm_admin
          POSTGRES_PASSWORD: hcm_ci_password
          POSTGRES_DB: hcm_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcm_admin -d hcm_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hcm_admin:hcm_ci_password@localhost:5432/hcm_platform
      NODE_ENV: test
      JWT_SECRET: ci-runtime-lifecycle-secret
      KAFKA_BROKERS: ""
      REDIS_URL: ""
      MFA_REQUIRED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build database package graph
        run: pnpm --filter @hcm/database... build

      - name: Run migrations against PostgreSQL
        run: pnpm --filter @hcm/database migrate

      - name: Seed runtime lifecycle data
        run: pnpm --filter @hcm/database seed

      - name: Build API package graph
        run: pnpm --filter @hcm/hr-api... build

      - name: Run runtime lifecycle E2E
        run: pnpm --filter @hcm/hr-api run test:lifecycle

      - name: Run golden workflow + tenant isolation E2E
        run: >-
          pnpm --filter @hcm/hr-api exec vitest run
          test/golden-workflow.e2e.test.ts
          test/tenant-isolation.e2e.test.ts
          test/finder-tenant-isolation.e2e.test.ts
          --passWithNoTests

      - name: Run outbox -> bus -> inbox drain E2E
        run: >-
          pnpm --filter @hcm/hr-api exec vitest run
          test/outbox-drain.e2e.test.ts
          --passWithNoTests

      - name: Run integration dead-letter persistence E2E
        run: >-
          pnpm --filter @hcm/hr-api exec vitest run
          test/integration-dead-letter.e2e.test.ts
          --passWithNoTests

  rls-enforcement-e2e:
    name: RLS-enabled tenant isolation E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: hcm_admin
          POSTGRES_PASSWORD: hcm_ci_password
          POSTGRES_DB: hcm_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcm_admin -d hcm_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      # Run the request path as the RLS-SUBJECT role with RLS ON — the real production posture.
      DB_RLS_ENABLED: "true"
      DATABASE_URL: postgresql://hcm_app:rls_ci_password@localhost:5432/hcm_platform
      SYSTEM_DATABASE_URL: postgresql://hcm_system:rls_ci_password@localhost:5432/hcm_platform
      JWT_SECRET: ci-rls-enforcement-secret
      KAFKA_BROKERS: ""
      REDIS_URL: ""
      MFA_REQUIRED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build database package graph
        run: pnpm --filter @hcm/database... build
      - name: Run migrations as the admin owner (creates RLS policies)
        run: pnpm --filter @hcm/database migrate
        env:
          DATABASE_URL: postgresql://hcm_admin:hcm_ci_password@localhost:5432/hcm_platform
      - name: Provision restricted RLS roles (hcm_app / hcm_system)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=hcm_ci_password psql -h localhost -U hcm_admin -d hcm_platform \
            -v app_password="'rls_ci_password'" -f infra/rls/provision-app-role.sql
      - name: Build API package graph
        run: pnpm --filter @hcm/hr-api... build
      - name: Tenant isolation E2E with RLS ENABLED (as hcm_app)
        run: >-
          pnpm --filter @hcm/hr-api exec vitest run
          test/tenant-isolation.e2e.test.ts
          test/finder-tenant-isolation.e2e.test.ts

  kafka-integration-test:
    name: Kafka real-broker integration E2E
    runs-on: ubuntu-latest
    services:
      # KRaft mode (no Zookeeper), single-node broker+controller. Health check and
      # listener wiring follow the official Apache Kafka Docker image's documented
      # single-node example. NOTE: unverified by a live CI run as of authoring this
      # job -- GitHub Actions on this repo is currently billing-locked, so this
      # config has only been validated by static review, not an actual run.
      kafka:
        image: apache/kafka:3.7.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    env:
      NODE_ENV: test
      KAFKA_BROKERS: localhost:9092
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API package graph
        run: pnpm --filter @hcm/hr-api... build

      - name: Run Kafka real-broker integration E2E
        run: >-
          pnpm --filter @hcm/hr-api exec vitest run
          test/kafka-event-bus.e2e.test.ts
          --passWithNoTests

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: pnpm secret:scan

      - name: Install osv-scanner
        run: |
          curl -sSL -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64
          chmod +x /usr/local/bin/osv-scanner

      - name: Production dependency audit
        run: pnpm dependency:audit

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hr-api
            dockerfile: apps/hr-api/Dockerfile
          - name: hr-web
            dockerfile: apps/hr-web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: hcm/${{ matrix.name }}:ci
          build-args: |
            VITE_API_BASE_URL=/api/v1

  load-smoke:
    name: App-under-load smoke (SLO gate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: hcm_admin
          POSTGRES_PASSWORD: hcm_ci_password
          POSTGRES_DB: hcm_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcm_admin -d hcm_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: development
      PORT: "3001"
      DATABASE_URL: postgresql://hcm_admin:hcm_ci_password@localhost:5432/hcm_platform
      REDIS_URL: redis://localhost:6379
      KAFKA_BROKERS: ""
      JWT_SECRET: ci-load-smoke-secret
      LOG_LEVEL: error
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build database + API graph
        run: pnpm --filter @hcm/hr-api... build
      - name: Run migrations
        run: pnpm --filter @hcm/database migrate
      - name: Boot API and load-test /health against SLO gates
        run: |
          node apps/hr-api/dist/main.js & API_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/v1/health >/dev/null 2>&1; then echo "API up"; break; fi
            sleep 2
          done
          LOAD_URL=http://localhost:3001/api/v1/health \
          LOAD_CONCURRENCY=25 LOAD_DURATION_MS=12000 LOAD_WARMUP_MS=1500 \
          LOAD_P95_MAX_MS=250 LOAD_MIN_RPS=150 LOAD_MAX_ERROR_RATE=0.01 \
          node scripts/load/smoke.mjs
          STATUS=$?
          kill $API_PID 2>/dev/null || true
          exit $STATUS
