name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to release, for example v1.4.1
        required: true

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Release gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: hcm_admin
          POSTGRES_PASSWORD: hcm_ci_password
          POSTGRES_DB: hcm_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcm_admin -d hcm_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hcm_admin:hcm_ci_password@localhost:5432/hcm_platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release gates
        run: |
          pnpm secret:scan
          pnpm audit --prod --audit-level high
          pnpm ci:verify-deployment-envelope
          pnpm --filter @hcm/database migrate
          pnpm typecheck
          pnpm test
          pnpm build

  publish-images:
    name: Publish container images
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/hr-api/Dockerfile
            repository: hr-hcm-api
          - image: web
            dockerfile: apps/hr-web/Dockerfile
            repository: hr-hcm-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          build-args: |
            VITE_API_BASE_URL=/api/v1

  github-release:
    name: Create GitHub release
    needs: publish-images
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          generate_release_notes: true
